name: uptime
on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch: {}
permissions:
  issues: write
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: check endpoints
        id: check
        run: |
          set -u
          FAIL=""
          for pair in "api-health|https://spinlid.ru/api/v1/health" "main-page|https://spinlid.ru/"; do
            nm="${pair%%|*}"
            url="${pair#*|}"
            code=$(curl -s -o /dev/null -m 25 -w "%{http_code}" "$url" || echo 000)
            if [ "$code" != "200" ]; then
              FAIL="${FAIL:+$FAIL; }$nm: HTTP $code"
            fi
          done
          if [ -n "$FAIL" ]; then
            printf 'down=true\ndetail=%s\n' "$FAIL" >> "$GITHUB_OUTPUT"
          else
            echo "down=false" >> "$GITHUB_OUTPUT"
          fi
      - name: open incident issue
        if: steps.check.outputs.down == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DETAIL: ${{ steps.check.outputs.detail }}
        run: |
          OPEN=$(gh issue list -R "$GITHUB_REPOSITORY" -l uptime-alert -s open --json number -q 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" -t "SpinLid недоступен" -l uptime-alert -b "$DETAIL — $(date -u '+%F %T UTC'), внешний монитор (GitHub Actions). Issue закроется при восстановлении."
          fi
      - name: close incidents on recovery
        if: steps.check.outputs.down == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" -l uptime-alert -s open --json number -q '.[].number' | xargs -r -I{} gh issue close -R "$GITHUB_REPOSITORY" {} -c "Восстановлено, все эндпоинты 200 ($(date -u '+%F %T UTC'))"
